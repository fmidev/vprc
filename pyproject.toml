[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vprc"
dynamic = ["version"]
description = 'FMI VPR correction'
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = []
authors = [
  { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "xarray",
  "numpy",
  "wradlib",
  "rioxarray",
  "pyproj",
  "pandas",
]

[project.urls]
Source = "https://github.com/fmidev/vprc"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/vprc"]

[tool.hatch.build.targets.wheel.force-include]
"src/vprc/radar_defaults.toml" = "vprc/radar_defaults.toml"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE.txt",
]

[dependency-groups]
# Installed by default with `uv sync`; click and matplotlib are needed by
# src/scripts and their tests.
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pandas-stubs",
  "click",
  "matplotlib",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source_pkgs = ["vprc", "tests"]
branch = true
parallel = true
omit = [
]

[tool.coverage.paths]
vprc = ["src/vprc", "*/vprc/src/vprc"]
tests = ["tests", "*/vprc/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
