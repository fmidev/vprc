[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vprc"
dynamic = ["version"]
description = "Koistinen & Pohjola vertical profile of reflectivity (VPR) correction for weather radar data"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["weather radar", "VPR", "vertical profile of reflectivity", "bright band", "meteorology"]
authors = [
  { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed",
]
# Lower bounds are the oldest versions tested in CI (the first releases with
# Python 3.14 wheels where applicable).
dependencies = [
  "xarray>=2025.9.0",
  "numpy>=2.3.2",
  "wradlib>=2.5.0",
  "rioxarray>=0.19.0",
  "pyproj>=3.7.2",
  "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://github.com/fmidev/vprc"
Documentation = "https://github.com/fmidev/vprc/tree/main/docs"
Source = "https://github.com/fmidev/vprc"
Issues = "https://github.com/fmidev/vprc/issues"
Changelog = "https://github.com/fmidev/vprc/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/vprc"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE.txt",
]

[dependency-groups]
# Installed by default with `uv sync`; click and matplotlib are needed by
# src/scripts and their tests.
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pandas-stubs",
  "click",
  "matplotlib",
]

[tool.uv]
# Pin the build backend so wheels and container images build reproducibly.
build-constraint-dependencies = [
  "hatchling==1.33.0",
  "hatch-vcs==0.5.0",
  "setuptools-scm==10.3.4",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# Nested conditions mirror the legacy validation steps, and short local
# accessor lambdas keep the profile pattern expressions readable.
ignore = ["SIM102", "E731"]

[tool.ruff.lint.per-file-ignores]
# Private names re-exported for backward compatibility.
"src/vprc/io/__init__.py" = ["F401"]

[tool.mypy]
files = ["src/vprc", "tests"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# The package ships py.typed, so its public annotations must be complete.
module = ["vprc.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["wradlib.*", "rasterio.*"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["vprc", "tests"]
branch = true
parallel = true
omit = [
]

[tool.coverage.paths]
vprc = ["src/vprc", "*/vprc/src/vprc"]
tests = ["tests", "*/vprc/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
